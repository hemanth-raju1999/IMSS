---
- name: RHOSP Post Validation - VM Creation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vm_name: "{{ vm_name }}"
    expected_flavor: "{{ flavor }}"
    expected_network: "{{ network }}"
    expected_az: "{{ az }}"
    expect_ip: true

  tasks:
    ###########################################################################
    # 1. Fetch the VM
    ###########################################################################
    - name: Get VM info
      openstack.cloud.server_info:
        server: "{{ vm_name }}"
      register: vm_info

    - name: Ensure VM exists
      assert:
        that:
          - vm_info.servers | length > 0
        fail_msg: "Post-validation FAILED — VM '{{ vm_name }}' does not exist"
        success_msg: "VM '{{ vm_name }}' found"

    - name: Set VM fact for easier reference
      set_fact:
        vm: "{{ vm_info.servers[0] }}"

    ###########################################################################
    # 2. Get image list (to resolve image name from ID)
    ###########################################################################
    - name: Get Images
      openstack.cloud.image_info:
      register: images

    ###########################################################################
    # 3. Build actual vs expected comparison facts
    ###########################################################################
    - name: Build check results
      set_fact:
        check_status: "{{ vm.status == 'ACTIVE' }}"
        check_flavor: "{{ vm.flavor.name == expected_flavor if vm.flavor.name is defined else vm.flavor.id == expected_flavor }}"
        check_az: "{{ vm.availability_zone == expected_az }}"
        check_network: "{{ expected_network in (vm.addresses | dict2items | map(attribute='key') | list) }}"
        check_ip: "{{ (vm.addresses.values() | list | flatten | map(attribute='addr') | list | length > 0) if expect_ip else true }}"
        actual_ip: "{{ vm.addresses.values() | list | flatten | map(attribute='addr') | list | join(', ') }}"
        actual_image: "{{ (images.images | selectattr('id', 'equalto', vm.image.id) | map(attribute='name') | first) if vm.image.id else 'boot-from-volume' }}"

    ###########################################################################
    # 4. Report each check clearly
    ###########################################################################
    - name: Display post-validation checks
      debug:
        msg:
          - "=========================================================="
          - "     POST-VALIDATION REPORT — VM: {{ vm_name }}"
          - "=========================================================="
          - "Status      : {{ vm.status }}"
          - "Flavor      : {{ vm.flavor.name | default(vm.flavor.id) }}"
          - "Image       : {{ actual_image }}"
          - "AZ          : {{ vm.availability_zone }}"
          - "Network     : {{ vm.addresses.keys() | list | join(', ') }}"
          - "IP Address  : {{ actual_ip if actual_ip else 'none' }}"
          - "Key Pair    : {{ vm.key_name | default('none', true) }}"
          - "Created     : {{ vm.created_at }}"
          - "=========================================================="

    ###########################################################################
    # 5. Ensure all checks passed — this is what gates the AAP workflow
    ###########################################################################
    - name: Ensure post-validation checks passed
      assert:
        that:
          - check_status
          - check_flavor
          - check_az
          - check_network
          - check_ip
        fail_msg: "Post-validation FAILED for VM '{{ vm_name }}' — see report above for details"
        success_msg: "Post-validation PASSED — VM '{{ vm_name }}' matches expected configuration"

